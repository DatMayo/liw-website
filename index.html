<style>
/* Fonts are served from this site (no third-party requests); SIL Open Font License, see assets/fonts/OFL-*.txt. */
@font-face { font-family: 'IM Fell English'; src: url('assets/fonts/imfell.woff2') format('woff2'); font-style: normal; font-display: swap; }
@font-face { font-family: 'IM Fell English'; src: url('assets/fonts/imfell-italic.woff2') format('woff2'); font-style: italic; font-display: swap; }
@font-face { font-family: 'IM Fell English SC'; src: url('assets/fonts/imfell-sc.woff2') format('woff2'); font-display: swap; }
@font-face { font-family: 'Crimson Pro'; src: url('assets/fonts/crimson.woff2') format('woff2'); font-weight: 400 600; font-style: normal; font-display: swap; }
@font-face { font-family: 'Crimson Pro'; src: url('assets/fonts/crimson-italic.woff2') format('woff2'); font-weight: 400; font-style: italic; font-display: swap; }
/* Layout: full-bleed night landscape hero, then one centred column of sections on dark earth; species as a filterable grid. */
:root {
    color-scheme: dark;
    --page: #14100c;
    --panel: #1d1712;
    --panel-2: #241c15;
    --ink: #ece3d2;
    --muted: #a99b84;
    --gold: #c8a35a;
    --gold-hi: #e3c27a;
    --rust: #b8603f;
    --moss: #8fb878;
    --line: rgba(200, 163, 90, 0.24);
    --display: 'IM Fell English SC', Georgia, serif;
    --old: 'IM Fell English', Georgia, serif;
    --body: 'Crimson Pro', Georgia, 'Times New Roman', serif;
    --gutter-l: max(16px, env(safe-area-inset-left, 0px));
    --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
html, body { background: var(--page); color: var(--ink); }
body { margin: 0; font-family: var(--body); font-size: 1.125rem; line-height: 1.6; }
a { color: var(--gold-hi); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; letter-spacing: 0.03em; text-wrap: balance; margin: 0; }
p { margin: 0; }

/* Top bar */
.bar { position: absolute; top: 0; left: 0; right: 0; z-index: 5; display: flex; align-items: center; gap: 1.5rem;
    padding: calc(1rem + env(safe-area-inset-top, 0px)) var(--gutter-r) 1rem var(--gutter-l); }
.bar .mark { font-family: var(--display); font-size: 1.15rem; letter-spacing: 0.12em; color: var(--ink); text-decoration: none; display: flex; align-items: center; gap: 0.6rem; }
.bar .mark span { display: grid; place-items: center; width: 2.1rem; height: 2.1rem; border: 1px solid var(--gold); border-radius: 50%; font-size: 0.85rem; color: var(--gold); }
.bar nav { display: flex; gap: 1.25rem; margin-left: auto; flex-wrap: wrap; }
.bar nav a { color: var(--ink); text-decoration: none; font-family: var(--old); font-size: 1rem; opacity: 0.85; }
.bar nav a:hover { color: var(--gold-hi); opacity: 1; }
.lang { display: flex; border: 1px solid var(--line); }
.lang button { font: inherit; font-family: var(--display); font-size: 0.85rem; letter-spacing: 0.1em; background: none; color: var(--muted); border: 0; padding: 0.25rem 0.6rem; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--gold); color: var(--page); }
@media (max-width: 52rem) { .bar nav { display: none; } .lang { margin-left: auto; } }

/* Hero */
.hero { position: relative; min-height: min(92vh, 52rem); display: grid; align-items: end; overflow: hidden;
    background: linear-gradient(180deg, #121a26 0%, #26303c 34%, #5d5348 62%, #8c6a45 74%, #2a2218 75%, #14100c 100%); }
.hero svg.scene { position: absolute; inset: auto 0 0 0; width: 100%; height: 62%; }
.hero .moon { position: absolute; top: 16%; right: 18%; width: clamp(4rem, 9vw, 7.5rem); aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle at 38% 38%, #fbf3dd, #e6d6b3 55%, #c9b48a); box-shadow: 0 0 4rem 1rem rgba(240, 225, 190, 0.18); }
.hero .mist { position: absolute; left: -10%; right: -10%; bottom: 20%; height: 18%; background: radial-gradient(ellipse at center, rgba(220, 210, 190, 0.16), transparent 70%);
    animation: drift 26s ease-in-out infinite alternate; }
@keyframes drift { to { transform: translateX(6%); } }
.hero-copy { position: relative; z-index: 2; display: grid; gap: 1.2rem; max-width: 46rem;
    padding: 7rem var(--gutter-r) clamp(3rem, 9vh, 6rem) var(--gutter-l); margin-left: max(var(--gutter-l), calc((100vw - 68rem) / 2)); }
.eyebrow { font-family: var(--display); font-size: 0.9rem; letter-spacing: 0.2em; color: var(--gold); }
.hero h1 { font-size: clamp(2.8rem, 8vw, 5.6rem); line-height: 0.95; text-shadow: 0 0.2rem 1.5rem rgba(0, 0, 0, 0.6); }
.hero .lede { font-size: clamp(1.15rem, 2.2vw, 1.4rem); max-width: 36rem; color: #e8decb; text-shadow: 0 0.1rem 0.8rem rgba(0, 0, 0, 0.7); }
.actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 0.4rem; }
.btn { display: inline-flex; align-items: center; gap: 0.55rem; padding: 0.75rem 1.4rem; font-family: var(--display); font-size: 1.05rem; letter-spacing: 0.08em; text-decoration: none; border: 1px solid var(--gold); }
.btn.primary { background: var(--gold); color: #1a130c; }
.btn.primary:hover { background: var(--gold-hi); }
.btn.ghost { color: var(--ink); background: rgba(20, 16, 12, 0.5); }
.btn.ghost:hover { border-color: var(--gold-hi); color: var(--gold-hi); }
.btn svg { width: 1.25rem; height: 1.25rem; fill: currentColor; }
.status { display: inline-flex; align-items: center; gap: 0.5rem; font-family: var(--old); font-size: 0.98rem; color: var(--muted); }
.status i { width: 0.55rem; height: 0.55rem; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0.6rem var(--gold); }

/* Sections */
main { display: grid; gap: clamp(4rem, 9vw, 7rem); padding-block: clamp(3rem, 7vw, 5rem) 4rem; }
.wrap { width: 100%; max-width: 68rem; margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.section-head { display: grid; gap: 0.6rem; margin-bottom: 2rem; max-width: 44rem; }
.section-head h2 { font-size: clamp(2rem, 4.5vw, 2.8rem); line-height: 1.05; }
.section-head p { color: var(--muted); }

/* Intro facts */
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
.fact { background: var(--page); padding: 1.4rem 1.5rem; display: grid; gap: 0.2rem; }
.fact b { font-family: var(--display); font-weight: 400; font-size: 2.4rem; line-height: 1; color: var(--gold); font-variant-numeric: tabular-nums; }
.fact span { color: var(--muted); font-size: 1rem; }
.manifest { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2rem 3rem; margin-top: 2.5rem; }
.manifest p { font-size: 1.2rem; }
.manifest p:first-child::first-letter { font-family: var(--display); float: left; font-size: 3.6rem; line-height: 0.85; padding: 0.3rem 0.5rem 0 0; color: var(--gold); }
@media (max-width: 44rem) { .manifest { grid-template-columns: 1fr; } }

/* Gameplay */
.pillars { display: grid; grid-template-columns: repeat(auto-fit, minmax(19rem, 1fr)); gap: 1.25rem; }
.pillar { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0.4rem 1rem; align-content: start; padding: 1.4rem 1.4rem 1.5rem; background: var(--panel); border-top: 2px solid var(--line); }
.pillar svg { grid-row: span 2; width: 2.4rem; height: 2.4rem; fill: none; stroke: var(--gold); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.pillar h3 { font-size: 1.35rem; color: var(--ink); }
.pillar p { color: #cfc4b0; font-size: 1.03rem; }

/* Species */
.filters { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; }
.filters button { font: inherit; font-family: var(--old); font-size: 1rem; color: var(--muted); background: none; border: 1px solid var(--line); padding: 0.3rem 0.9rem; cursor: pointer; }
.filters button[aria-pressed="true"] { color: var(--page); background: var(--gold); border-color: var(--gold); }
.species { display: grid; grid-template-columns: repeat(auto-fill, minmax(16.5rem, 1fr)); gap: 1rem; }
.animal { display: grid; gap: 0.7rem; padding: 1.2rem 1.25rem 1.3rem; background: var(--panel); border: 1px solid transparent; }
.animal:hover { border-color: var(--line); }
.animal header { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; }
.animal h3 { font-size: 1.35rem; }
.animal .cls { font-family: var(--display); font-size: 0.72rem; letter-spacing: 0.12em; padding: 0.05rem 0.45rem; border: 1px solid currentColor; white-space: nowrap; }
.cls.carnivore { color: var(--rust); } .cls.herbivore { color: var(--moss); } .cls.omnivore { color: var(--gold); }
.animal p { color: #cfc4b0; font-size: 1rem; line-height: 1.45; }
.stats { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0.2rem 0.6rem; font-size: 0.82rem; color: var(--muted); align-items: center; }
.stats .bar-track { height: 0.3rem; background: rgba(255, 255, 255, 0.08); }
.stats .bar-fill { height: 100%; background: var(--gold); opacity: 0.8; }

/* Life cycle */
.life { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); position: relative; }
.life::before { content: ''; position: absolute; top: 1.05rem; left: 12.5%; right: 12.5%; height: 1px; background: var(--line); }
.stage { display: grid; justify-items: center; text-align: center; gap: 0.6rem; padding: 0 0.75rem; }
.stage i { position: relative; width: 2.1rem; height: 2.1rem; border-radius: 50%; border: 1px solid var(--gold); background: var(--page); display: grid; place-items: center; font-style: normal; font-family: var(--display); color: var(--gold); }
.stage h3 { font-size: 1.25rem; }
.stage p { color: var(--muted); font-size: 0.98rem; }
.stage.dead i { border-color: var(--rust); color: var(--rust); }
.life-note { margin-top: 2rem; padding: 1.1rem 1.4rem; border-left: 2px solid var(--rust); background: var(--panel); color: #d8cdb8; }
@media (max-width: 44rem) {
    .life { grid-template-columns: 1fr; gap: 1.5rem; }
    .life::before { top: 0; bottom: 0; left: 1.05rem; right: auto; width: 1px; height: auto; }
    .stage { grid-template-columns: auto minmax(0, 1fr); justify-items: start; text-align: left; column-gap: 1rem; padding: 0; }
    .stage i { grid-row: span 2; }
}

/* Join */
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 1.25rem; counter-reset: step; }
.step { position: relative; padding: 1.4rem 1.3rem 1.4rem; background: var(--panel-2); counter-increment: step; display: grid; gap: 0.5rem; align-content: start; }
.step::before { content: counter(step); font-family: var(--display); font-size: 2.6rem; line-height: 1; color: var(--gold); }
.step h3 { font-size: 1.25rem; }
.step p { color: #cfc4b0; font-size: 1rem; }
.step code { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: 0.9rem; background: rgba(0, 0, 0, 0.35); padding: 0.1rem 0.4rem; color: var(--gold-hi); overflow-wrap: anywhere; }
.join-cta { margin-top: 1.75rem; display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; }
.join-cta p { color: var(--muted); }

/* Rules */
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(19rem, 1fr)); gap: 0 3rem; margin: 0; padding: 0; list-style: none; counter-reset: rule; }
.rules li { counter-increment: rule; display: grid; grid-template-columns: 2.2rem minmax(0, 1fr); gap: 0.2rem 0.75rem; padding: 1rem 0; border-bottom: 1px solid var(--line); }
.rules li::before { content: counter(rule, upper-roman); grid-row: span 2; font-family: var(--display); color: var(--gold); font-size: 1.2rem; }
.rules b { font-family: var(--old); font-weight: 400; font-size: 1.15rem; }
.rules span { color: var(--muted); font-size: 1rem; }

/* Roadmap */
.road { display: grid; gap: 0; border-left: 1px solid var(--line); margin-left: 0.5rem; }
.phase { position: relative; padding: 0 0 2rem 1.75rem; display: grid; gap: 0.35rem; }
.phase::before { content: ''; position: absolute; left: -0.45rem; top: 0.45rem; width: 0.8rem; height: 0.8rem; border-radius: 50%; background: var(--page); border: 2px solid var(--muted); }
.phase.done::before { background: var(--gold); border-color: var(--gold); }
.phase.now::before { border-color: var(--gold); box-shadow: 0 0 0 0.3rem rgba(200, 163, 90, 0.2); }
.phase .tag { font-family: var(--display); font-size: 0.78rem; letter-spacing: 0.14em; color: var(--muted); }
.phase.done .tag, .phase.now .tag { color: var(--gold); }
.phase h3 { font-size: 1.35rem; }
.phase p { color: #cfc4b0; font-size: 1rem; max-width: 46rem; }

/* FAQ */
.faq { display: grid; gap: 0.5rem; }
.faq details { background: var(--panel); padding: 0 1.25rem; }
.faq summary { cursor: pointer; padding: 1rem 0; font-family: var(--old); font-size: 1.15rem; list-style: none; display: flex; justify-content: space-between; gap: 1rem; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: '+'; color: var(--gold); font-family: var(--display); }
.faq details[open] summary::after { content: '–'; }
.faq details p { padding: 0 0 1.1rem; color: #cfc4b0; }

/* Footer */
footer { border-top: 1px solid var(--line); padding-block: 2rem calc(2rem + env(safe-area-inset-bottom, 0px)); }
footer .wrap { display: flex; flex-wrap: wrap; gap: 1rem 2rem; justify-content: space-between; align-items: center; color: var(--muted); font-size: 0.95rem; }
footer nav { display: flex; gap: 1.25rem; flex-wrap: wrap; }
footer a { color: var(--muted); }
footer small { flex-basis: 100%; font-size: 0.85rem; opacity: 0.8; }

@media (prefers-reduced-motion: reduce) { .hero .mist { animation: none; } html { scroll-behavior: auto; } }
</style>

            r3_h: 'No powergaming', r3: 'No exploiting bugs, no tricks to escape death or a fight.',
            r4_h: 'No metagaming', r4: 'What you learn outside the game, your animal does not know.',
            r5_h: 'Fight fair', r5: 'No killing without a reason. Herbivores defend themselves, they do not hunt players.',
            r6_h: 'Get help', r6: 'Problems or bugs: open a ticket on the Discord instead of arguing in the game.',
            dev_eyebrow: 'Development', dev_title: 'Where we are',
            dev_lede: 'Life In Wilderness is built entirely in-house, without a ready-made framework. Testers help make it better every week.',
            ph_done: 'Done', ph_test: 'In testing', ph_planned: 'Planned',
            ph0_h: 'Foundation', ph0: 'Players as animals, a world without humans, camera, combat and animations for every species.',
            ph1_h: 'The core game', ph1: 'Characters, needs, health, feeding, combat, senses, packs, progression, voice and HUD.',
            ph2_h: 'Long-term play', ph2: 'Aging, seasons, territories, bloodlines and litters, companions, quests, achievements and titles, pack fame and ten more species.',
            ph3_h: 'Expansions', ph3: 'Diseases like rabies, legendary animals, alliances between packs, Halloween and Christmas events, more species.',
            ph4_h: 'Later', ph4: 'Birds with their own flight system, water animals and seasonal rankings.',
            faq_title: 'Frequently asked questions',
            q1: 'Do I need Red Dead Redemption 2?', a1: 'Yes, the PC version. RedM itself is free.',
            q2: 'Can I play a human?', a2: 'No. On Life In Wilderness every player is an animal.',
            q3: 'What happens when my animal dies?', a3: 'It is gone for good. You can create a new animal or take over a juvenile from a litter – maybe even from your own bloodline.',
            q4: 'How many animals can I have?', a4: 'Three slots per account. A slot is freed when an animal dies.',
            q5: 'Do I have to speak German?', a5: 'No. The game is in English and German, the language is detected automatically.',
            q6: 'Is there a text chat?', a6: 'Not in the game. You talk through proximity voice, animal sounds and the emote wheel.',
            imprint: 'Imprint', privacy: 'Privacy',
            disclaimer: 'Life In Wilderness is a fan project and is not affiliated with Rockstar Games or Take-Two Interactive.',
        },
    };

    let lang = 'de';
    let filter = 'all';
    try {
        const saved = localStorage.getItem('liw_lang');
        lang = saved === 'en' || saved === 'de' ? saved : (navigator.language || 'de').toLowerCase().startsWith('de') ? 'de' : 'en';
    } catch { lang = (navigator.language || 'de').toLowerCase().startsWith('de') ? 'de' : 'en'; }

    const t = (key) => T[lang][key] ?? T.de[key] ?? '';

    function renderSpecies() {
        const grid = document.getElementById('species');
        grid.replaceChildren(...SPECIES.filter((s) => filter === 'all' || s[1] === filter).map(([key, cls, stats, de, en, dDe, dEn]) => {
            const card = document.createElement('article');
            card.className = 'animal';
            card.dataset.species = key;
            const head = document.createElement('header');
            const h = document.createElement('h3');
            h.textContent = lang === 'de' ? de : en;
            const c = document.createElement('span');
            c.className = `cls ${cls}`;
            c.textContent = t(`cls_${cls}`);
            head.append(h, c);
            const p = document.createElement('p');
            p.textContent = lang === 'de' ? dDe : dEn;
            const list = document.createElement('div');
            list.className = 'stats';
            stats.forEach((v, i) => {
                const label = document.createElement('span');
                label.textContent = t(STAT_KEYS[i]);
                const track = document.createElement('div');
                track.className = 'bar-track';
                track.setAttribute('role', 'img');
                track.setAttribute('aria-label', `${t(STAT_KEYS[i])} ${v}/10`);
                const fill = document.createElement('div');
                fill.className = 'bar-fill';
                fill.style.width = `${v * 10}%`;
                track.append(fill);
                list.append(label, track);
            });
            card.append(head, p, list);
            return card;
        }));
    }

    function render() {
        document.documentElement.lang = lang;
        document.querySelectorAll('[data-t]').forEach((el) => {
            const value = t(el.dataset.t);
            if (value.includes('<code>')) el.innerHTML = value; else el.textContent = value;
        });
        document.querySelectorAll('[data-t-label]').forEach((el) => el.setAttribute('aria-label', t(el.dataset.tLabel)));
        document.querySelectorAll('.lang button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
        renderSpecies();
    }

    document.querySelectorAll('.lang button').forEach((b) => b.addEventListener('click', () => {
        lang = b.dataset.lang;
        try { localStorage.setItem('liw_lang', lang); } catch { /* private window */ }
        render();
    }));
    document.querySelectorAll('.filters button').forEach((b) => b.addEventListener('click', () => {
        filter = b.dataset.filter;
        document.querySelectorAll('.filters button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
        renderSpecies();
    }));
    document.querySelectorAll('[data-discord]').forEach((a) => { a.href = DISCORD_URL; a.target = '_blank'; a.rel = 'noopener'; });
    document.querySelectorAll('[data-connect]').forEach((a) => { a.href = CONNECT_URL; });
    render();
})();
</script>
</body>
</html>
