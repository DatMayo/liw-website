<html lang="de">

<title>Life In Wilderness</title>

<meta property="og:title" content="Life In Wilderness">
<meta property="og:description" content="Ein RedM-Roleplay-Server, auf dem jeder Spieler ein Tier ist. / A RedM roleplay server where every player is an animal.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2314100c' stroke='%23c8a35a'/%3E%3Ctext x='16' y='20.5' font-family='Georgia' font-size='11' text-anchor='middle' fill='%23c8a35a'%3ELiW%3C/text%3E%3C/svg%3E">
<style>
/* Fonts are served from this site (no third-party requests); SIL Open Font License, see assets/fonts/OFL-*.txt. */
@font-face { font-family: 'IM Fell English'; src: url('assets/fonts/imfell.woff2') format('woff2'); font-style: normal; font-display: swap; }
@font-face { font-family: 'IM Fell English'; src: url('assets/fonts/imfell-italic.woff2') format('woff2'); font-style: italic; font-display: swap; }
@font-face { font-family: 'IM Fell English SC'; src: url('assets/fonts/imfell-sc.woff2') format('woff2'); font-display: swap; }
@font-face { font-family: 'Crimson Pro'; src: url('assets/fonts/crimson.woff2') format('woff2'); font-weight: 400 600; font-style: normal; font-display: swap; }
@font-face { font-family: 'Crimson Pro'; src: url('assets/fonts/crimson-italic.woff2') format('woff2'); font-weight: 400; font-style: italic; font-display: swap; }
/* Layout: a full-screen night sky with a floating bar on top, a strip of numbers over its lower edge, then
   one column of card sections; species as small picture tiles with one detail panel. */
:root {
    color-scheme: dark;
    --page: #0f0d0b;
    --panel: #191512;
    --panel-2: #211b15;
    --ink: #efe7d8;
    --muted: #9f927e;
    --gold: #d6ae5e;
    --gold-hi: #e8c47a;
    --rust: #c8694a;
    --moss: #8fb878;
    --line: rgba(239, 231, 216, 0.09);
    --line-gold: rgba(214, 174, 94, 0.3);
    --radius: 18px;
    --display: 'IM Fell English SC', Georgia, serif;
    --old: 'IM Fell English', Georgia, serif;
    --body: 'Crimson Pro', Georgia, 'Times New Roman', serif;
    --gutter-l: max(16px, env(safe-area-inset-left, 0px));
    --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
html, body { background: var(--page); color: var(--ink); }
body { margin: 0; font-family: var(--body); font-size: 1.125rem; line-height: 1.6; overflow-x: hidden; }
a { color: var(--gold); }
h1, h2, h3 { font-family: var(--display); font-weight: normal; line-height: 1.05; margin: 0; }
p { margin: 0; }
.wrap { width: min(1180px, 100% - var(--gutter-l) - var(--gutter-r)); margin: 0 auto; }
.eyebrow { font-family: var(--display); font-size: 0.95rem; letter-spacing: 0.28em; color: var(--gold); text-transform: lowercase; margin-bottom: 0.6rem; }
:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; }

/* Floating bar */
.bar {
    position: fixed; z-index: 10; top: 14px; left: 50%; transform: translateX(-50%);
    width: min(1180px, 100% - var(--gutter-l) - var(--gutter-r));
    display: flex; align-items: center; gap: 1.25rem; padding: 0.5rem 0.6rem 0.5rem 1.1rem;
    border: 1px solid rgba(239, 231, 216, 0.12); border-radius: 999px;
    background: rgba(15, 13, 11, 0.6); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    transition: background 0.2s;
}
.bar.scrolled { background: rgba(15, 13, 11, 0.88); }
.mark { display: flex; align-items: center; gap: 0.6rem; color: var(--ink); text-decoration: none; font-family: var(--display); font-size: 1.2rem; letter-spacing: 0.12em; white-space: nowrap; }
.mark span { display: grid; place-items: center; width: 2.1rem; height: 2.1rem; border: 1px solid var(--gold); border-radius: 50%; font-size: 0.75rem; letter-spacing: 0.04em; color: var(--gold); }
.bar nav { display: flex; gap: 1.1rem; margin-left: auto; }
.bar nav a { color: var(--muted); text-decoration: none; font-size: 1.05rem; white-space: nowrap; }
.bar nav a:hover { color: var(--ink); }
.lang { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.lang button { border: none; background: none; color: var(--muted); font: inherit; font-size: 0.85rem; letter-spacing: 0.08em; padding: 0.15rem 0.65rem; border-radius: 999px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--gold); color: #14110c; }
.bar .discord { background: var(--gold); color: #14110c; text-decoration: none; border-radius: 999px; padding: 0.4rem 1.1rem; font-family: var(--display); letter-spacing: 0.08em; white-space: nowrap; }
.menu { display: none; }

/* Hero */
.hero {
    position: relative; min-height: max(100svh, 640px); overflow: hidden; display: grid; place-items: center;
    background:
        radial-gradient(ellipse 45% 35% at 74% 20%, rgba(240, 226, 190, 0.16), transparent 62%),
        linear-gradient(180deg, #131923 0%, #1c1b1f 42%, #2a2016 70%, #0f0d0b 100%);
}
.hero .moon { position: absolute; top: 15%; right: 19%; width: clamp(3.5rem, 7vw, 6rem); aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle at 38% 36%, #fbf3dc, #e2d3ad 60%, #c9b88e); box-shadow: 0 0 80px 18px rgba(240, 226, 190, 0.25); }
.hero svg.scene { position: absolute; inset: auto 0 0 0; width: 100%; height: 56%; }
.hero-copy { position: relative; z-index: 1; text-align: center; padding: 7rem var(--gutter-r) 9rem var(--gutter-l); max-width: 60rem; }
.hero h1 { font-size: clamp(3.2rem, 9vw, 8rem); line-height: 0.95; letter-spacing: 0.02em; text-shadow: 0 12px 60px rgba(0, 0, 0, 0.6); margin: 0.4rem 0 1.4rem; }
.hero .lede { font-size: clamp(1.15rem, 1.8vw, 1.45rem); color: #ddd3c0; max-width: 40rem; margin: 0 auto 2rem; line-height: 1.5; }
.actions { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
.btn { display: inline-flex; align-items: center; gap: 0.55rem; padding: 0.85rem 1.6rem; border-radius: 999px; text-decoration: none;
    font-family: var(--display); font-size: 1.1rem; letter-spacing: 0.08em; color: var(--ink); border: 1px solid rgba(239, 231, 216, 0.3); backdrop-filter: blur(8px); }
.btn:hover { border-color: var(--gold); }
.btn.primary { background: var(--gold); color: #14110c; border-color: var(--gold); box-shadow: 0 10px 40px rgba(214, 174, 94, 0.3); }
.btn.primary:hover { background: var(--gold-hi); }
.btn svg { width: 1.25rem; height: 1.25rem; fill: currentColor; }
.status { margin-top: 1.4rem; display: inline-flex; gap: 0.5rem; align-items: center; color: var(--muted); font-size: 1rem; }
.status i { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--moss); box-shadow: 0 0 10px var(--moss); }

/* Numbers over the lower edge of the hero */
.facts { position: relative; z-index: 2; margin-top: -4.5rem; display: grid; grid-template-columns: repeat(4, 1fr);
    border: 1px solid var(--line-gold); border-radius: 22px; background: rgba(25, 21, 18, 0.88); backdrop-filter: blur(10px); }
.fact { padding: 1.4rem 1.6rem; border-right: 1px solid var(--line); }
.fact:last-child { border-right: none; }
.fact b { display: block; font-family: var(--old); font-weight: normal; font-size: 2.6rem; line-height: 1; color: var(--gold); }
.fact span { color: var(--muted); font-size: 1rem; line-height: 1.35; display: block; margin-top: 0.3rem; }

/* Sections */
main section { padding: 6.5rem 0 0; }
.section-head { margin-bottom: 2rem; max-width: 46rem; }
.section-head h2 { font-size: clamp(2.2rem, 4vw, 3.2rem); margin-bottom: 0.75rem; }
.section-head p:not(.eyebrow) { color: var(--muted); font-size: 1.15rem; }
.manifest { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; color: #d9cfbc; font-size: 1.2rem; line-height: 1.65; }
.manifest p:first-child::first-letter { font-family: var(--old); float: left; font-size: 3.6rem; line-height: 0.85; padding: 0.3rem 0.5rem 0 0; color: var(--gold); }

.pillars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.pillar { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.4rem; transition: border-color 0.2s, transform 0.2s; }
.pillar:hover { border-color: var(--line-gold); transform: translateY(-2px); }
.pillar .ic { width: 2.8rem; height: 2.8rem; border-radius: 12px; display: grid; place-items: center; background: rgba(214, 174, 94, 0.12); margin-bottom: 1rem; }
.pillar svg { width: 1.7rem; height: 1.7rem; fill: none; stroke: var(--gold); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.pillar h3 { font-size: 1.45rem; margin-bottom: 0.4rem; }
.pillar p { color: var(--muted); font-size: 1.02rem; line-height: 1.5; }

/* Species: filter, tiles, detail */
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1rem; }
.filters button { font: inherit; font-size: 1rem; padding: 0.4rem 1rem; border-radius: 10px; background: var(--panel); color: var(--muted); border: 1px solid var(--line); cursor: pointer; }
.filters button[aria-pressed="true"] { color: var(--ink); border-color: var(--gold); }
.species { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); gap: 10px; }
.tile { font: inherit; color: var(--ink); text-align: center; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 0.6rem 0.6rem 0.8rem; cursor: pointer; transition: border-color 0.15s, background 0.15s; }
.tile:hover { border-color: var(--line-gold); }
.tile[aria-pressed="true"] { border-color: var(--gold); background: var(--panel-2); }
.tile .pic { aspect-ratio: 4 / 3; border-radius: 10px; background: radial-gradient(circle at 50% 65%, rgba(214, 174, 94, 0.14), transparent 70%), #15110e; overflow: hidden; display: grid; place-items: center; }
.tile img { width: 100%; height: 100%; object-fit: contain; }
.tile b { display: block; font-weight: 600; margin-top: 0.45rem; line-height: 1.2; }
.tile small { color: var(--muted); font-size: 0.85rem; }
.detail { margin-top: 12px; display: grid; grid-template-columns: 0.9fr 1fr 1.1fr; gap: 1.8rem; align-items: center; background: var(--panel); border: 1px solid var(--line-gold); border-radius: var(--radius); padding: 1.6rem; }
.detail .pic { aspect-ratio: 4 / 3; border-radius: 14px; background: radial-gradient(circle at 50% 65%, rgba(214, 174, 94, 0.18), transparent 70%), #15110e; display: grid; place-items: center; overflow: hidden; }
.detail .pic img { width: 100%; height: 100%; object-fit: contain; }
.detail h3 { font-size: 2.2rem; }
.cls { display: inline-block; margin: 0.5rem 0 0.8rem; font-size: 0.8rem; letter-spacing: 0.14em; text-transform: uppercase; border: 1px solid var(--line-gold); border-radius: 999px; padding: 0.1rem 0.7rem; color: var(--gold); }
.cls.herbivore { color: var(--moss); border-color: rgba(143, 184, 120, 0.4); }
.cls.omnivore { color: #d39a6a; border-color: rgba(211, 154, 106, 0.4); }
.detail p { color: #d4cab7; }
.stats { display: grid; grid-template-columns: 7.5rem 1fr 1.5rem; gap: 0.45rem 0.8rem; align-items: center; font-size: 0.98rem; color: var(--muted); }
.bar-track { height: 6px; border-radius: 6px; background: rgba(239, 231, 216, 0.08); overflow: hidden; }
.bar-fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--gold), var(--gold-hi)); transition: width 0.4s; }
.credit { margin-top: 0.6rem; font-size: 0.85rem; color: var(--muted); }

/* Life */
.life { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; position: relative; }
.stage { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.3rem; }
.stage i { font-style: normal; font-family: var(--old); color: var(--gold); font-size: 1.6rem; }
.stage h3 { font-size: 1.4rem; margin: 0.3rem 0; }
.stage p { color: var(--muted); font-size: 1rem; }
.stage.dead { border-color: rgba(200, 105, 74, 0.35); }
.stage.dead i { color: var(--rust); }
.life-note { margin-top: 14px; padding: 1rem 1.3rem; border-left: 3px solid var(--rust); background: rgba(200, 105, 74, 0.07); border-radius: 0 12px 12px 0; color: #d4cab7; }

/* Join */
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; counter-reset: step; }
.step { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.3rem; position: relative; }
.step::before { counter-increment: step; content: counter(step); display: grid; place-items: center; width: 2.2rem; height: 2.2rem; border-radius: 50%; background: var(--gold); color: #14110c; font-family: var(--old); font-size: 1.2rem; margin-bottom: 0.9rem; }
.step h3 { font-size: 1.35rem; margin-bottom: 0.4rem; }
.step p { color: var(--muted); font-size: 1rem; }
.step code { font-size: 0.9rem; background: rgba(0, 0, 0, 0.35); border: 1px solid var(--line); border-radius: 6px; padding: 0.05rem 0.35rem; color: var(--ink); }
.join-cta { margin-top: 1.4rem; display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; }
.join-cta p { flex-basis: 100%; color: var(--muted); font-size: 1rem; }
.copy { display: inline-flex; align-items: center; gap: 0.7rem; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 0.55rem 0.6rem 0.55rem 1rem; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.95rem; color: var(--muted); }
.copy b { color: var(--ink); font-weight: normal; }
.copy button { font: inherit; font-family: var(--body); font-size: 0.95rem; background: var(--panel-2); color: var(--gold); border: 1px solid var(--line-gold); border-radius: 8px; padding: 0.2rem 0.7rem; cursor: pointer; }

/* Rules */
.rules { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; counter-reset: rule; }
.rules li { counter-increment: rule; display: grid; grid-template-columns: 2.6rem 1fr; gap: 0 1rem; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.1rem 1.3rem; }
.rules li::before { content: counter(rule, upper-roman); grid-row: span 2; font-family: var(--old); color: var(--gold); font-size: 1.5rem; }
.rules b { font-family: var(--display); font-weight: normal; font-size: 1.3rem; }
.rules span { color: var(--muted); font-size: 1rem; }

/* Roadmap */
.road { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.phase { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.2rem; position: relative; }
.phase::before { content: ''; display: block; height: 4px; border-radius: 4px; background: rgba(239, 231, 216, 0.1); margin-bottom: 1rem; }
.phase.done::before { background: var(--moss); }
.phase.now::before { background: linear-gradient(90deg, var(--gold) 55%, rgba(239, 231, 216, 0.1) 55%); }
.phase .tag { font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.phase.done .tag { color: var(--moss); }
.phase.now .tag { color: var(--gold); }
.phase h3 { font-size: 1.3rem; margin: 0.3rem 0 0.4rem; }
.phase p { color: var(--muted); font-size: 0.98rem; line-height: 1.45; }

/* FAQ */
.faq { display: grid; gap: 10px; max-width: 52rem; }
.faq details { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 0 1.2rem; }
.faq details[open] { border-color: var(--line-gold); }
.faq summary { cursor: pointer; list-style: none; padding: 1rem 0; font-size: 1.15rem; display: flex; justify-content: space-between; gap: 1rem; }
.faq summary::after { content: '+'; color: var(--gold); font-size: 1.4rem; line-height: 1; }
.faq details[open] summary::after { content: '–'; }
.faq summary::-webkit-details-marker { display: none; }
.faq p { color: var(--muted); padding-bottom: 1rem; }

/* Closing call and footer */
.closing { margin-top: 6.5rem; border-radius: 26px; padding: 3rem 2rem; text-align: center; border: 1px solid var(--line-gold);
    background: radial-gradient(ellipse 60% 80% at 50% 0%, rgba(214, 174, 94, 0.16), transparent 70%), var(--panel); }
.closing h2 { font-size: clamp(2rem, 4vw, 3rem); margin-bottom: 1.2rem; }
footer { margin-top: 5rem; border-top: 1px solid var(--line); padding: 2rem 0 3rem; color: var(--muted); font-size: 0.95rem; }
footer .wrap { display: flex; flex-wrap: wrap; gap: 1rem 2rem; align-items: center; }
footer nav { display: flex; gap: 1.2rem; margin-left: auto; }
footer a { color: var(--muted); }
footer small { flex-basis: 100%; font-size: 0.85rem; opacity: 0.8; }

@media (max-width: 1080px) {
    .bar nav { display: none; }
    .menu { display: inline-flex; margin-left: auto; font: inherit; background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 999px; padding: 0.3rem 0.9rem; cursor: pointer; }
    .bar.open { border-radius: 22px; flex-wrap: wrap; }
    .bar.open nav { display: flex; flex-direction: column; gap: 0.6rem; flex-basis: 100%; order: 10; padding: 0.6rem 0.4rem 0.8rem; }
    .pillars { grid-template-columns: repeat(2, 1fr); }
    .road { grid-template-columns: repeat(2, 1fr); }
    .detail { grid-template-columns: 1fr 1fr; }
    .detail .pic { grid-column: span 2; max-height: 16rem; }
}
@media (max-width: 720px) {
    .bar .discord { display: none; }
    .facts { grid-template-columns: repeat(2, 1fr); margin-top: -3rem; }
    .fact:nth-child(2) { border-right: none; }
    .fact:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
    .manifest, .pillars, .life, .steps, .rules, .road, .detail { grid-template-columns: 1fr; }
    .detail .pic { grid-column: auto; }
    .species { grid-template-columns: repeat(3, 1fr); }
    .tile b { font-size: 0.95rem; }
    .hero-copy { padding-bottom: 7rem; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .pillar, .bar-fill { transition: none; } }
</style>
</head>

                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.3 4.4A19.6 19.6 0 0015.4 3l-.6 1.3a18 18 0 00-5.6 0L8.6 3a19.6 19.6 0 00-4.9 1.5C.6 9.2-.3 13.8.1 18.3a19.8 19.8 0 006 3l1.3-2a12.7 12.7 0 01-2-1l.5-.4a14 14 0 0012.2 0l.5.4-2 1 1.3 2a19.7 19.7 0 006-3c.5-5.2-.8-9.8-3.6-13.9zM8 15.6c-1.2 0-2.2-1.1-2.2-2.4S6.8 10.8 8 10.8s2.2 1.1 2.2 2.4-1 2.4-2.2 2.4zm8 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4z"/></svg>

            manifest_1: 'On Life In Wilderness there are no playable humans. Every player is an animal from the world of RDR2: wolf, cougar, bison, alligator. The towns are empty and no coach rides the roads. What is left is the wilderness – and everything that lives in it.',

    let lang = 'de';
    let filter = 'all';
    try {
        const saved = localStorage.getItem('liw_lang');
        lang = saved === 'en' || saved === 'de' ? saved : (navigator.language || 'de').toLowerCase().startsWith('de') ? 'de' : 'en';
    } catch { lang = (navigator.language || 'de').toLowerCase().startsWith('de') ? 'de' : 'en'; }

    const t = (key) => T[lang][key] ?? T.de[key] ?? '';

    // Pictures of the animals: RedM Forge (redm-forge.com), side view of the model the species uses.
    const IMG_BASE = 'https://cdn.redm-forge.com/img/peds/';
    const imageOf = (key) => {
        const img = IMAGES[key];
        return img ? `${IMG_BASE}${img[0]}_${img[2]}.webp?v=${img[1]}` : '';
    };
    let selected = 'wolf';

    function renderDetail() {
        const s = SPECIES.find((x) => x[0] === selected) || SPECIES[0];
        const [key, cls, stats, de, en, dDe, dEn] = s;
        const name = lang === 'de' ? de : en;
        const img = document.getElementById('detail-img');
        img.src = imageOf(key);
        img.alt = name;
        document.getElementById('detail-name').textContent = name;
        const c = document.getElementById('detail-cls');
        c.className = `cls ${cls}`;
        c.textContent = t(`cls_${cls}`);
        document.getElementById('detail-text').textContent = lang === 'de' ? dDe : dEn;
        const list = document.getElementById('detail-stats');
        list.replaceChildren(...stats.flatMap((v, i) => {
            const label = document.createElement('span');
            label.textContent = t(STAT_KEYS[i]);
            const track = document.createElement('div');
            track.className = 'bar-track';
            track.setAttribute('role', 'img');
            track.setAttribute('aria-label', `${t(STAT_KEYS[i])} ${v}/10`);
            const fill = document.createElement('div');
            fill.className = 'bar-fill';
            fill.style.width = `${v * 10}%`;
            track.append(fill);
            const num = document.createElement('span');
            num.textContent = v;
            return [label, track, num];
        }));
    }

    function renderSpecies() {
        const grid = document.getElementById('species');
        const list = SPECIES.filter((s) => filter === 'all' || s[1] === filter);
        if (!list.some((s) => s[0] === selected) && list.length) selected = list[0][0];
        grid.replaceChildren(...list.map(([key, cls, , de, en]) => {
            const tile = document.createElement('button');
            tile.type = 'button';
            tile.className = 'tile';
            tile.setAttribute('aria-pressed', String(key === selected));
            const pic = document.createElement('div');
            pic.className = 'pic';
            const img = document.createElement('img');
            img.src = imageOf(key);
            img.alt = '';
            img.loading = 'lazy';
            pic.append(img);
            const b = document.createElement('b');
            b.textContent = lang === 'de' ? de : en;
            const small = document.createElement('small');
            small.textContent = t(`cls_${cls}`);
            tile.append(pic, b, small);
            tile.addEventListener('click', () => {
                selected = key;
                grid.querySelectorAll('.tile').forEach((x) => x.setAttribute('aria-pressed', String(x === tile)));
                renderDetail();
            });
            return tile;
        }));
        renderDetail();
    }

    function render() {
        document.documentElement.lang = lang;
        document.querySelectorAll('[data-t]').forEach((el) => {
            const value = t(el.dataset.t);
            if (value.includes('<code>')) el.innerHTML = value; else el.textContent = value;
        });
        document.querySelectorAll('[data-t-label]').forEach((el) => el.setAttribute('aria-label', t(el.dataset.tLabel)));
        document.querySelectorAll('.lang button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
        renderSpecies();
    }

    document.querySelectorAll('.lang button').forEach((b) => b.addEventListener('click', () => {
        lang = b.dataset.lang;
        try { localStorage.setItem('liw_lang', lang); } catch { /* private window */ }
        render();
    }));
    document.querySelectorAll('.filters button').forEach((b) => b.addEventListener('click', () => {
        filter = b.dataset.filter;
        document.querySelectorAll('.filters button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
        renderSpecies();
    }));
    document.querySelectorAll('[data-discord]').forEach((a) => { a.href = DISCORD_URL; a.target = '_blank'; a.rel = 'noopener'; });
    document.querySelectorAll('[data-connect]').forEach((a) => { a.href = CONNECT_URL; });
    // Copy the connect command; menu on small screens; the bar gets darker once the page scrolls.
    const copyButton = document.getElementById('copy');
    copyButton.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText('connect cfx.re/join/4ggl8rq'); copyButton.textContent = t('copied'); }
        catch { copyButton.textContent = 'connect cfx.re/join/4ggl8rq'; }
        setTimeout(() => { copyButton.textContent = t('copy'); }, 2000);
    });
    const bar = document.getElementById('bar');
    const menu = bar.querySelector('.menu');
    menu.addEventListener('click', () => {
        const open = !bar.classList.contains('open');
        bar.classList.toggle('open', open);
        menu.setAttribute('aria-expanded', String(open));
    });
    bar.querySelectorAll('nav a').forEach((a) => a.addEventListener('click', () => { bar.classList.remove('open'); menu.setAttribute('aria-expanded', 'false'); }));
    const onScroll = () => bar.classList.toggle('scrolled', window.scrollY > 40);
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    render();
})();
